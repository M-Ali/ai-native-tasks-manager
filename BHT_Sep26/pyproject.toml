[project]
name = "autopulse"
version = "0.1.0"
description = "Category analytics for the group's automobile clients: market monitor first, built on public data with private per-client layers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.scripts]
autopulse = "autopulse.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
