# Fertilizer lexicon for data/COMMENTS.xlsx (YouTube agronomy channels, Pakistan).
# Built AFTER reading all 1,433 comments. Single quotes on every pattern.
# Roman Urdu spellings are wildly variable (nitrophos / nitrofas / natrofas / naitrofast);
# stems are used where a single spelling would miss most of them.

