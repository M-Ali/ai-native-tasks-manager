[project]
name = "slic-pq"
version = "0.1.0"
description = "Bid-readiness toolkit for the SLIC (State Life Insurance Corporation of Pakistan) advertising-agency prequalification, ref P78118"
readme = "README.md"
authors = [
    { name = "M. Ali", email = "spreadfast@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.1.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
slic-pq = "slic_pq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slic_pq"]
