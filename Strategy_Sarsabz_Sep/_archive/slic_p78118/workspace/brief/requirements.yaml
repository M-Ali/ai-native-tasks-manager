brief:
  client: State Life Insurance Corporation of Pakistan (SLIC)
  reference: P78118
  title: Prequalification for Procurement of Advertising Agencies
  source_file: data/pq-bidding-document (2).pdf
  portal: https://epads.gov.pk/opportunities/federal/procurements/78118
  method: Single Stage - One Envelope, National
  selection: Quality Based Selection (QBS)
  total_marks: 100
  pass_mark: 50
  submission_deadline: 2026-09-03 11:00
  submission_channel: EPADS v2.0 only - manual submission not entertained
  clarification_deadline: 2026-08-31

the_ask: |
  SLIC wants to prequalify advertising agencies for a 2026-28 roster, and will issue the
  real RFP only to those that pass. Despite being called a prequalification, this is a
  pitch with a paperwork gate: 70 of the 100 technical marks are a speculative campaign
  (concept, competitive analysis, communication strategy, creative artworks, media mix),
  and only 30 are corporate documents. Pass mark is 50, so the paperwork alone cannot
  qualify us.

  The gate is press and broadcast accreditation - APNS, PBA, AAP and PID - which means
  SLIC is buying a full-service ATL agency, not a digital practice. Only the applicant
  entity's own qualifications count (ITA 22.1, 23.3) and joint ventures are capped at nil
  members, so we cannot lean on Group scale or an affiliate's accreditation.

missing:
  - what: Section VII - Schedule of Requirements
    referenced_at: ITA 6.8 and ITA 1.1; PDS clause 1 points to "section services and Lots"
    action: Check the EPADS opportunity page for the Services/Lots section and any attachment
    question: >-
      Which product line, audience and objective should the campaign submission address
      (individual life / group and corporate / Takaful / corporate brand), and is there a
      required format or page limit?
  - what: Campaign brief for the 70-mark submission
    referenced_at: Evaluation Criteria p.22-23 scores five campaign components with no brief given
    action: File with the clarification above before 31 August
    question: Is there a defined objective, budget or target segment for the campaign concept?

