_category:
  - The category has converged on apps, and stopped proving anything.
  - >-
    Jubilee drives 83% of its output into Jubilee Active; EFU 67% across Thrive, PRIMUS
    and WIN; Adamjee 42% into its Customer Care App. The claims differ, the destination is
    identical. Meanwhile 78% of category advertising carries no proof of any kind, and in
    a category selling retirement, legacy and life protection, not one ad in 144 is cast
    for anyone over 60.

_dimensions:
  - >-
    Five brands published no brand-building at all. State Life is second in the category
    on that measure - the problem was never absence, it is that four corporate-PR posts
    and three calendar posts dilute the four that do the work.
  - >-
    Two brands are quieter than they look: Dawood has not posted in 454 days, and Askari's
    IRAADA KARO platform is pinned from June 2025 while its current output is product-led.

State Life Insurance Corporation of Pakistan:
  headline: Second-strongest brand-builder in the category, diluted by its own PR.
  saying:
    - "PLAN AHEAD WITH STATE LIFE - education before the admission form, healthcare before you need care, opportunity when you're prepared."
    - "'What does five decades of purpose look like? Trust earned, promises kept.'"
    - "E-Kachehri: 745 complaints received, 744 resolved."
    - "Against that: two plaque handovers, a conference panel, a flag-raising, a fellowship visit."
  note: >-
    33% brand-building - above EFU, Jubilee, Adamjee and TPL. But 0% ecosystem push, no
    proof device on any of the four brand ads, and the strongest credibility number in
    the category is filed as grievance-redress paperwork.

EFU Life Assurance:
  headline: The largest private insurer now advertises like a loyalty card.
  saying:
    - "'Freshly made patties... avail 25% Discount' - PRIMUS partner offer."
    - "'Download Thrive, sign up, and earn 2,000 EFU Life Coins.'"
    - "KraveMart vouchers on the WIN app; 20% off a clinic; 30% off diagnostics."
    - "Historic work was duty and dignity - Zaroori Hai, Izzat say Nazrain Milain."
  note: >-
    67% of output drives to an owned app across three separate ecosystems. 17%
    brand-building. The duty territory EFU built over nineteen years is vacated.

Jubilee Life Insurance:
  headline: Owns the proof territory. Spends its output on an app.
  saying:
    - "'Every claim tells a story of trust. In 2025, we paid PKR 54 billion in claims.'"
    - "That post is pinned, dated 29 June, and is the only one of its kind."
    - "Jubilee Active appears in 9 of 12 posts - steps, points, 40% off a cafe."
    - "Half the feed is reposted creator content."
  note: >-
    83% ecosystem push - the highest in the category - and 8% brand-building. The one
    competitor standing in the proof territory is standing there with a single June post.

Adamjee Life Assurance:
  headline: An app rollout wearing an anniversary.
  saying:
    - "'Skip the queues and pay with ease' - Adamjee Life Digital App."
    - "'Everything you need, all in one place' - coverage, comparisons, claims."
    - "'Ten years is more than a milestone.' Decade of Dedication."
    - "'The Home to Every Life' - map of Pakistan, heritage illustration."
  note: >-
    0% brand-building across twelve posts. Five product-feature ads for the app, three
    corporate-PR, two calendar. The anniversary is doing the work a proposition should do.

IGI Life Insurance:
  headline: The best objection work in the category, aimed at the wrong objection.
  saying:
    - "'Think life insurance is only for when you have a family? Think again.'"
    - "'I'm too young for life insurance. It's a common belief, but is it true?'"
    - "'Planning for your child's education doesn't have to wait.'"
    - "IGI Life Vitality: PKR 500 weekly reward with foodpanda; 20-20-20 screen rule."
  note: >-
    33% brand-building and the highest objection-handling rate in the set. But every myth
    it busts is about purchase timing - never about whether the insurer pays.

Askari Life Assurance:
  headline: A platform that stopped being carried.
  saying:
    - "'One decision today can make every moment meaningful' - IRAADA KARO / Jeeto Har Ghari."
    - "Those three posts are PINNED, dated 12 June 2025."
    - "Current output: Golden Path, Education Plan, Family Takaful - product-led."
    - "'Har khwab ki apni ek kahani hoti hai' - Urdu-first, the strongest writing in the set."
  note: >-
    50% brand-building, the highest in the category, on 623 followers. But the platform is
    fourteen months old and pinned to the top of a grid that has moved on without it.

TPL Life Insurance:
  headline: Narrow, uncontested, and entirely unproven.
  saying:
    - "'From Dubai to London, Globewell keeps you protected' - 185+ countries."
    - "Coverage up to $500,000; 24/7 worldwide medical assistance."
    - "Sehat Zindagi for the mass market: nationwide, PKR 1,250,000."
    - "Two of twelve posts are partnership photography."
  note: >-
    0% brand-building, 8 of 12 posts product-feature, and no proof device anywhere. Owns
    international healthcare cleanly - and asserts every claim in it.

Pak-Qatar Family Takaful:
  headline: Borrowing the federal association State Life owns outright.
  saying:
    - "'Pakistan's first Takaful company appointed by the Federal Government as Authorized Pension Fund Manager.'"
    - "'Retirement deserves certainty. Your future deserves a plan.' Lifetime Kafalat."
    - "'What if your savings paid you every month?' - Mahana Bachat."
    - "AA / AM2+ ratings badge on eleven of twelve creatives."
  note: >-
    The only brand in the set using a proof device systematically. 0% brand-building, but
    it advertises federal appointment as a credential - the exact association State Life
    holds by constitution rather than by contract.

Dawood Family Takaful:
  headline: The sharpest ad in the sample, from a brand that went silent.
  saying:
    - "'TIE YOUR CAMEL AND TRUST IN ALLAH' - Prophet Muhammad (PBUH), Jami at Tirmidhi 2517."
    - "'Takaful is different from conventional insurance. It follows Islamic principles.'"
    - "'Takaful covers more than you think - it's a full-circle protection.'"
    - "Last post: 5 June 2025."
  note: >-
    454 days dormant. It answers the fatalism objection with scripture - braver category
    work than any of the big four - and then stopped. Credit the work, not the competitor.

EFU Life Window Takaful:
  headline: The state association, borrowed a second time.
  saying:
    - "'Among the first entities partnering' the Federal Hemayah Pension Fund."
    - "'Retirement planning... abhi se? Jee haan, abhi se!'"
    - "EFU Life mHealth onboarding PMDC-certified specialists."
    - "'Skip the queues! Pay your premium digitally via EFU LifeBot on WhatsApp.'"
  note: >-
    0% brand-building, seven product-feature posts, 20 days quiet. Like Pak-Qatar, reaches
    for federal association as a credibility device it does not own.

Al Meezan Investments:
  headline: The loudest voice in the category, and not an insurer.
  saying:
    - "81.8K followers - four times EFU, thirty times State Life."
    - "'Rapid Reads: we decode 20 years of KSE100 market cycles.'"
    - "'You already use Easypaisa to make payments. Now use it to start building your...'"
    - "'Think retirement planning can wait? Think again!' - Myth & Fact."
  note: >-
    A Shariah-compliant fund manager out-publishes the entire life category, does real
    published analysis, and competes for the same protection-and-savings wallet.

UBL Fund Managers:
  headline: Liquidity as the counter-offer.
  saying:
    - "'Fauri Paisa - your money, when you need it. Instant redemption up to PKR 1,000,000.'"
    - "'Swipe to Simplicity with the new Al-Ameen Funds App.'"
    - "'Invest Via RAAST - tap, transfer, and grow.'"
    - "Three of twelve posts are recruitment ads."
  note: >-
    0% brand-building. Attacks life insurance exactly where it is weakest - money locked
    away for decades - by selling instant access to it.

_finding:
  headline: The vacant territory is proof.
  body:
    - "Not trust as a feeling. Trust as an audited, publishable, repeatable number."
    - >-
      78% of category advertising offers no proof of anything. Two ads in 144 cite a claims
      figure. The question every buyer actually asks - will they pay? - is answered in
      passing, by one competitor, once, in June, and then abandoned for two months of
      fitness reels.
    - >-
      State Life already owns the strongest number in the category and publishes it as
      paperwork.

_own:
  headline: What State Life can credibly own
  number: "744 of 745"
  number_note:
    - "complaints resolved."
    - >-
      Published in a grievance-redress announcement, in a government template, to 2,499
      followers.
  why:
    - "Stronger than Jubilee's number, not weaker."
    - >-
      Rupees paid measures volume. Disputes resolved measures behaviour when the customer
      pushes back. That is the objection.
    - >-
      And there is a first audience nobody is competing for: across 144 ads, not one is
      cast for the over-60s.
  pillars_title: Three things no private competitor can copy
  pillars:
    - title: Sovereign backing
      body: >-
        A state-owned insurer's promise is underwritten by the state. Pak-Qatar and EFU
        both advertise borrowed federal association - the thing State Life owns.
    - title: A statutory grievance obligation
      body: >-
        E-Kachehri is a duty, not a campaign. It generates the number every quarter
        whether or not marketing wants it.
    - title: No ecosystem to defend
      body: >-
        Three competitors are pouring output into loyalty apps. State Life is at 0%, and
        is free to compete on the promise rather than on discount vouchers.
  kicker: >-
    The one competitor standing in this territory is standing there with a single June
    post. This is not a contested position. It is an unattended one.
