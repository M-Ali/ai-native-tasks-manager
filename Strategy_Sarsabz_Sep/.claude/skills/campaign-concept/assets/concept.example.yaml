# The chain, written down before any copy. See SKILL.md "The chain".
asset: >-
  State-owned: the promise is underwritten by the state, and a statutory grievance
  obligation generates a published resolution figure every cycle.
tension: >-
  Will they actually pay? 81% of category advertising proves nothing, so the question
  goes unanswered and the doubt stands.
territory: Proof - trust as a published, repeatable number rather than a feeling.
proposition: >-
  State Life publishes what it settles, because a promise you can check is the only
  kind worth making.
line: "<the words the work carries - often not the proposition>"
mechanic: >-
  The resolution figure, published every cycle. It refreshes itself, so the campaign
  generates work rather than repeating a launch.
executions:
  press: "<the tender gates on press accreditation - lead here>"
  broadcast: "<TVC/DVC>"
  digital: "<supporting>"
asks_of_client: >-
  Publishing the figure on a cadence means a bad quarter is public too. That is a
  choice for the client, presented with its trade-off, not resolved for them.
