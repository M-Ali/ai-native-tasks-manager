[project]
name = "sarsabz-pitch"
version = "0.1.0"
description = "Pitch toolkit for the Fatima Fertilizer (Sarsabz / Bubber Sher) creative-agency brief 2026"
readme = "README.md"
authors = [
    { name = "M. Ali", email = "spreadfast@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.1.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
sarsabz-pitch = "sarsabz_pitch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarsabz_pitch"]
